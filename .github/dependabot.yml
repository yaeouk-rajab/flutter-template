version: 2
updates:
  # Flutter/Dart packages (root pubspec.yaml)
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 18.x -> 22.x renames the plugin's API to named parameters and changes
      # the native build; analyze fails until reminder_scheduler.dart and the
      # Android build are migrated together. Do that as a deliberate change,
      # not through a grouped Dependabot PR.
      - dependency-name: "flutter_local_notifications"
        versions: [">= 19.0.0"]
  # Android Gradle build (android/ and android/app)
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
